<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルなWebサイト</title>

  <style>
    /* 全体 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #f5f5f5;
      padding-bottom: 100px;
    }

    /* ヘッダー */
    header {
      background-color: #440000;
      color: white;
      text-align: center;
      padding: 25px;
    }

    header h1 {
      margin: 0;
    }

    /* メイン */
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: #cc0000;
    }

    section {
      background-color: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    section h2 {
      color: #cc0000;
    }

    /* フッター */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #440000;
      color: white;
      text-align: center;
      padding: 15px;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      color: #ecf0f1;
      margin: 0 10px;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <h1>はじめての名古屋観光</h1>
  </header>

  <!-- メインコンテンツ -->
  <main>

    <section>
      <h2>観光スポット</h2>
      <p>
        名古屋を代表する歴史的スポットや観光名所を紹介します。
      </p>
       <img src="画像のリンク" alt="サンプル">
    </section>

    <section>
      <h2>グルメ</h2>
      <p>
        名古屋名物の味噌カツや手羽先など、おすすめのグルメを紹介します。
      </p>
       <img src="画像のリンク" alt="サンプル">
    </section>

  </main>

  <!-- フッター -->
  <footer>
    <p>お問い合わせ：info@example.com | 03-1234-5678</p>

    <p>
      <a href="https://www.facebook.com/" target="_blank">Facebook</a>
      <a href="https://www.instagram.com/" target="_blank">Instagram</a>
      <a href="https://x.com/" target="_blank">X</a>
    </p>
  </footer>

</body>
</html>
